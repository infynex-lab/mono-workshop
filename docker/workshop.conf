<VirtualHost *:80>
    DocumentRoot /var/www/html

    # mod_mono: which server binary to launch, which URL -> folder mappings to host.
    # "workshop" is an alias that ties these directives and the <Location> blocks together.
    MonoServerPath   workshop "/usr/bin/mod-mono-server4"
    MonoApplications workshop "/webforms:/var/www/webforms,/mvc:/var/www/mvc"
    MonoSetEnv       workshop HOME=/tmp

    <Location "/webforms">
        Require all granted
        MonoSetServerAlias workshop
        SetHandler mono
    </Location>

    <Location "/mvc">
        Require all granted
        MonoSetServerAlias workshop
        SetHandler mono
    </Location>

    ErrorLog  /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
